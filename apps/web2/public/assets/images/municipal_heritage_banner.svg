    <rect x="420" y="160" width="35" height="52" opacity="0.6"/>
    <rect x="465" y="140" width="28" height="72" opacity="0.5"/>
    <polygon points="465,140 479,122 493,140" opacity="0.5"/>
    <rect x="505" y="152" width="42" height="60" opacity="0.6"/>
    <rect x="560" y="166" width="30" height="46" opacity="0.5"/>

    <!-- Right Municipal Infrastructure & Urban Center -->
    <!-- Modern Metro Viaduct / Bridge arch -->
    <path d="M 680 212 C 720 185 760 185 800 212 Z" opacity="0.6"/>
    <path d="M 780 212 C 820 185 860 185 900 212 Z" opacity="0.6"/>

    <!-- Right Civic Assembly Dome Complex -->
    <rect x="800" y="124" width="140" height="88"/>
    <!-- Grand Central Classical Dome -->
    <ellipse cx="870" cy="124" rx="38" ry="46"/>
    <rect x="840" y="120" width="60" height="8"/>
    <polygon points="866,74 870,55 874,74"/>
    <circle cx="870" cy="52" r="3.5"/>
    <!-- Dome Lantern Arches -->
    <rect x="852" y="98" width="6" height="14" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="867" y="98" width="6" height="14" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="882" y="98" width="6" height="14" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <!-- Front Pillars -->
    <rect x="815" y="144" width="8" height="68"/>
    <rect x="835" y="144" width="8" height="68"/>
    <rect x="855" y="144" width="8" height="68"/>
    <rect x="875" y="144" width="8" height="68"/>
    <rect x="895" y="144" width="8" height="68"/>
    <rect x="915" y="144" width="8" height="68"/>

    <!-- Trees Right Side -->
    <circle cx="760" cy="182" r="20"/>
    <circle cx="780" cy="174" r="24"/>
    <circle cx="958" cy="178" r="22"/>
    <circle cx="978" cy="186" r="18"/>
  </g>
</svg>
