<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicResolve - City Map Hotspots</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/copilot.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .map-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: calc(100vh - 120px);
        }

        .map-controls-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .map-filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .map-select {
            padding: 8px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13.5px;
            background: #ffffff;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .map-select:focus {
            border-color: #3b82f6;
        }

        .map-legend {
            display: flex;
            gap: 14px;
            align-items: center;
            font-size: 12.5px;
            color: #475569;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-critical { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
        .legend-medium { background: #f59e0b; }
        .legend-low { background: #3b82f6; }
        .legend-resolved { background: #10b981; }

        #hotspot-map {
            flex: 1;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            z-index: 1;
            min-height: 500px;
        }

        /* Custom Leaflet Marker Styling */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
            transition: transform 0.2s;
        }
        .custom-marker:hover {
            transform: scale(1.2);
            z-index: 1000 !important;
        }
        .marker-critical { background: #ef4444; }
        .marker-medium { background: #f59e0b; }
        .marker-low { background: #3b82f6; }
        .marker-resolved { background: #10b981; }

        /* Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }
        .hotspot-popup {
            padding: 8px 6px;
            font-family: inherit;
            max-width: 260px;
        }
        .hotspot-popup-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f1f5f9;
        }
        .hotspot-popup-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #0f172a;
        }
        .hotspot-popup-badges {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .hotspot-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .hotspot-popup-loc {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .hotspot-popup-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .hotspot-popup-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <h1>🏛️ CivicResolve</h1>
                    <span class="tagline">City Map Hotspots</span>
                </div>
                <div class="header-actions">
                    <div class="notification-bell">
                        <span class="bell-icon">🔔</span>
                        <span class="notification-count" id="notification-count">0</span>
                    </div>
                    <div class="user-menu">
                        <span id="welcome-message">Welcome, Admin!</span>
                        <button id="logout-btn" class="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </header>
        
        <nav class="sidebar">
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link">📊 Dashboard</a></li>
                <li><a href="reports.html" class="nav-link">📋 Reports</a></li>
                <li><a href="map.html" class="nav-link active">🗺️ Map Hotspots</a></li>
                <li><a href="analytics.html" class="nav-link">📈 Analytics</a></li>
                <li><a href="users.html" class="nav-link">👥 Users</a></li>
                <li><a href="categories.html" class="nav-link">🏷️ Categories</a></li>
                <li><a href="settings.html" class="nav-link">⚙️ Settings</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <div class="map-wrapper">
                <!-- Controls Card -->
                <div class="map-controls-card">
                    <div class="map-filter-group">
                        <label for="category-filter" style="font-weight:600; font-size:13.5px;">Filter Category:</label>
                        <select id="category-filter" class="map-select">
                            <option value="all">🌐 All Categories</option>
                            <option value="roads">🛣️ Roads & Infrastructure</option>
                            <option value="waste">🗑️ Waste Management</option>
                            <option value="water">💧 Water & Sewage</option>
                            <option value="streetlights">💡 Streetlights & Electricity</option>
                            <option value="public_safety">🚨 Public Safety</option>
                        </select>

                        <label for="priority-filter" style="font-weight:600; font-size:13.5px;">Priority:</label>
                        <select id="priority-filter" class="map-select">
                            <option value="all">All Priorities</option>
                            <option value="high">🔴 Critical / High</option>
                            <option value="medium">🟡 Medium</option>
                            <option value="low">🔵 Low</option>
                        </select>

                        <button id="recenter-btn" class="btn btn-secondary" style="padding: 7px 14px; font-size: 13px;">🎯 Recenter City</button>
                        <span id="report-count-badge" style="font-size: 13px; color: #64748b; font-weight: 500;">Plotting complaints...</span>
                    </div>

                    <div class="map-legend">
                        <div class="legend-item"><span class="legend-dot legend-critical"></span> High / Critical</div>
                        <div class="legend-item"><span class="legend-dot legend-medium"></span> Medium</div>
                        <div class="legend-item"><span class="legend-dot legend-low"></span> Low</div>
                        <div class="legend-item"><span class="legend-dot legend-resolved"></span> Resolved/Closed</div>
                    </div>
                </div>

                <!-- Leaflet Map Container -->
                <div id="hotspot-map"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth-simple.js"></script>
    <script src="js/copilot.js"></script>

    <script>
        class MapHotspotsApp {
            constructor() {
                this.map = null;
                this.markersLayer = null;
                this.hotspotsLayer = null;
                this.reports = [];
                this.defaultCenter = [12.9716, 77.5946]; // Default City Center (Bengaluru / Civic Hub)
                this.defaultZoom = 13;

                this.init();
            }

            async init() {
                this.initMap();
                this.bindEvents();
                await this.loadReports();
                this.initRealtime();
            }

            initRealtime() {
                if (window.supabaseService) {
                    window.supabaseService.initRealtimeSubscription(
                        (newReport) => {
                            console.log('🔴 Realtime new report on map:', newReport);
                            const existingIndex = this.reports.findIndex(r => String(r.id) === String(newReport.id));
                            if (existingIndex === -1) {
                                this.reports.unshift(newReport);
                            } else {
                                this.reports[existingIndex] = newReport;
                            }
                            this.renderMarkers();
                        },
                        (updatedReport) => {
                            console.log('🔵 Realtime updated report on map:', updatedReport);
                            const existingIndex = this.reports.findIndex(r => String(r.id) === String(updatedReport.id));
                            if (existingIndex !== -1) {
                                this.reports[existingIndex] = updatedReport;
                            } else {
                                this.reports.unshift(updatedReport);
                            }
                            this.renderMarkers();
                        }
                    );
                }
            }

            initMap() {
                this.map = L.map('hotspot-map').setView(this.defaultCenter, this.defaultZoom);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors | CivicResolve'
                }).addTo(this.map);

                this.hotspotsLayer = L.layerGroup().addTo(this.map);
                this.markersLayer = L.layerGroup().addTo(this.map);
            }

            bindEvents() {
                document.getElementById('category-filter')?.addEventListener('change', () => this.renderMarkers());
                document.getElementById('priority-filter')?.addEventListener('change', () => this.renderMarkers());
                document.getElementById('recenter-btn')?.addEventListener('click', () => {
                    if (this.markersLayer.getLayers().length > 0) {
                        const bounds = L.featureGroup(this.markersLayer.getLayers()).getBounds();
                        this.map.fitBounds(bounds, { padding: [50, 50] });
                    } else {
                        this.map.setView(this.defaultCenter, this.defaultZoom);
                    }
                });
            }

            async loadReports() {
                try {
                    const countEl = document.getElementById('report-count-badge');
                    if (countEl) countEl.textContent = 'Loading live reports...';

                    if (window.supabaseService) {
                        this.reports = await window.supabaseService.getAllReports({ limit: 200 });
                    }
                    console.log(`🗺️ Loaded ${this.reports.length} reports for map view`);
                    this.renderMarkers();
                } catch (e) {
                    console.error('Failed to load reports for map:', e);
                    const countEl = document.getElementById('report-count-badge');
                    if (countEl) countEl.textContent = '0 complaints loaded (live database error)';
                }
            }

            renderMarkers() {
                this.markersLayer.clearLayers();
                this.hotspotsLayer.clearLayers();

                const categoryFilter = document.getElementById('category-filter').value;
                const priorityFilter = document.getElementById('priority-filter').value;

                let validPoints = [];

                this.reports.forEach(report => {
                    // Extract coordinates
                    let lat = report.latitude;
                    let lng = report.longitude;

                    if ((!lat || !lng) && report.coordinates) {
                        lat = report.coordinates.lat || report.coordinates.latitude;
                        lng = report.coordinates.lng || report.coordinates.longitude;
                    }

                    if (!lat || !lng) return;

                    lat = parseFloat(lat);
                    lng = parseFloat(lng);
                    if (isNaN(lat) || isNaN(lng)) return;

                    // Filter category
                    const cat = (report.category || '').toLowerCase();
                    if (categoryFilter !== 'all' && !cat.includes(categoryFilter.toLowerCase())) {
                        return;
                    }

                    // Filter priority
                    const prio = (report.priority || 'medium').toLowerCase();
                    if (priorityFilter === 'high' && !(prio.includes('high') || prio.includes('critical'))) return;
                    if (priorityFilter === 'medium' && !prio.includes('medium')) return;
                    if (priorityFilter === 'low' && !prio.includes('low')) return;

                    validPoints.push([lat, lng]);

                    // Determine color code
                    let markerClass = 'marker-medium';
                    let radiusColor = '#f59e0b';
                    const status = (report.status || '').toLowerCase();

                    if (status.includes('resolved') || status.includes('closed') || status.includes('verified')) {
                        markerClass = 'marker-resolved';
                        radiusColor = '#10b981';
                    } else if (prio.includes('critical') || prio.includes('high')) {
                        markerClass = 'marker-critical';
                        radiusColor = '#ef4444';
                    } else if (prio.includes('low')) {
                        markerClass = 'marker-low';
                        radiusColor = '#3b82f6';
                    }

                    // Add 200m Proximity Circle Buffer for active/high priority issues
                    if (!status.includes('resolved') && !status.includes('closed')) {
                        L.circle([lat, lng], {
                            radius: 200,
                            color: radiusColor,
                            fillColor: radiusColor,
                            fillOpacity: 0.12,
                            weight: 1.5,
                            dashArray: '4, 4'
                        }).addTo(this.hotspotsLayer);
                    }

                    // Custom HTML Icon Marker
                    const icon = L.divIcon({
                        className: `custom-marker ${markerClass}`,
                        html: `<span>#${report.id}</span>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    // Build image preview
                    let imgHtml = '';
                    let imageUrl = null;
                    if (report.image_urls) {
                        try {
                            const parsed = typeof report.image_urls === 'string' ? JSON.parse(report.image_urls) : report.image_urls;
                            if (Array.isArray(parsed) && parsed.length > 0) imageUrl = parsed[0];
                        } catch (err) {}
                    }
                    if (imageUrl) {
                        imgHtml = `<img src="${imageUrl}" class="hotspot-popup-img" alt="Report image" onerror="this.style.display='none'">`;
                    }

                    const popupContent = `
                        <div class="hotspot-popup">
                            ${imgHtml}
                            <h4 class="hotspot-popup-title">#${report.id}: ${this.escapeHtml(report.title || 'Civic Issue')}</h4>
                            <div class="hotspot-popup-badges">
                                <span class="hotspot-badge" style="background:#e0e7ff;color:#3730a3;">🏷️ ${this.escapeHtml(report.category || 'General')}</span>
                                <span class="hotspot-badge" style="background:${radiusColor}20;color:${radiusColor};border:1px solid ${radiusColor}">⚡ ${(report.priority || 'Medium').toUpperCase()}</span>
                            </div>
                            <p class="hotspot-popup-loc">📍 ${this.escapeHtml(report.location || `${lat.toFixed(4)}, ${lng.toFixed(4)}`)}</p>
                            <a href="reports.html?id=${report.id}" class="hotspot-popup-btn">View Ticket Details ➔</a>
                        </div>
                    `;

                    L.marker([lat, lng], { icon: icon })
                        .bindPopup(popupContent)
                        .addTo(this.markersLayer);
                });

                document.getElementById('report-count-badge').textContent = `Showing ${validPoints.length} complaints on map`;

                if (validPoints.length > 0) {
                    const bounds = L.latLngBounds(validPoints);
                    this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                }
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.mapApp = new MapHotspotsApp();
        });
    </script>
</body>
</html>
